name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .work/tmp | Out-Null
          $env:DOTNET_CLI_HOME = (Resolve-Path .work).Path
          $env:NUGET_PACKAGES = Join-Path $env:DOTNET_CLI_HOME 'nuget'
          dotnet build MyAntigravity.sln -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/MyAntigravity.Tests -c Release --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install Inno Setup 6.7.4
        id: inno
        shell: pwsh
        run: |
          $installer = Join-Path (Get-Location) '.work/inno.exe'
          $innoDir = Join-Path (Get-Location) '.work/inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw 'Inno Setup publisher verification failed.'
          }
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /NOICONS /DIR="' + $innoDir + '"'
          $process = Start-Process $installer -ArgumentList $arguments -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode) { throw "Inno Setup install failed: $($process.ExitCode)" }
          $iscc = Join-Path $innoDir 'ISCC.exe'
          "path=$iscc" >> $env:GITHUB_OUTPUT
      - name: Package
        shell: pwsh
        env:
          ISCC_PATH: ${{ steps.inno.outputs.path }}
        run: ./packaging/Build-Release.ps1 -Iscc $env:ISCC_PATH
      - name: Smoke test the installer
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $root = Join-Path (Resolve-Path .work) 'installer smoke'
          $target = Join-Path $root 'installed application'
          $installer = (Resolve-Path dist/MyAntigravity-Setup.exe).Path
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=desktopicon /DIR="' + $target + '"'
          $process = Start-Process $installer -ArgumentList $arguments -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode) { throw "MyAntigravity setup exit code $($process.ExitCode)." }
          $executable = Join-Path $target 'MyAntigravity.exe'
          $shortcut = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'MyAntigravity.lnk'
          if (!(Test-Path -LiteralPath $executable) -or !(Test-Path -LiteralPath (Join-Path $target 'data') -PathType Container) -or
              !(Test-Path -LiteralPath $shortcut)) { throw 'Installed application, data directory, or desktop shortcut is missing.' }
          $shell = New-Object -ComObject WScript.Shell
          if ($shell.CreateShortcut($shortcut).TargetPath -ine $executable) { throw 'Desktop shortcut target is incorrect.' }

          # A deliberately invalid CLI checks the packaged headless mode without downloading software.
          $fixture = New-Item -ItemType Directory -Force (Join-Path $root 'local/agy')
          Set-Content -LiteralPath (Join-Path $fixture.FullName 'agy.exe') -Value 'invalid test binary'
          $report = Join-Path $root 'cli-error.txt'
          $process = Start-Process $executable -ArgumentList ('--setup-cli "' + $report + '"') -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 1 -or !(Test-Path -LiteralPath $report) -or
              [string]::IsNullOrWhiteSpace((Get-Content -Raw -Encoding UTF8 -LiteralPath $report))) {
            throw 'Packaged CLI setup mode did not return a readable failure report.'
          }
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: MyAntigravity-windows-x64
          path: |
            dist/MyAntigravity-Setup.exe
            dist/update-*.json
            dist/app/
          if-no-files-found: error
          retention-days: 7
